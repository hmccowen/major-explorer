</head>
<body>
  <div id="root"></div>
  
  <script type="text/babel">
import React, { useState } from 'react';

const MajorExplorer = () => {
  const [currentScreen, setCurrentScreen] = useState('intro');

  const [isLaserFocused, setIsLaserFocused] = useState(false);

    "New Jersey", "New Mexico", "New York", "North Carolina", "North Dakota", "Ohio",

    "Tennessee", "Texas", "Utah", "Vermont", "Virginia", "Washington", "West Virginia",

  const gradYears = ["2025", "2026", "2027", "2028", "2029", "2030", "2031", "2032", "2033", "2034", "2035"];

  const skillsCategories = {
    "Communication & Expression": [
      "Writing (essays, stories, posts, scripts—getting ideas on paper)",

      "Explaining things so others \"get it\" (the friend who tutors/translates teacher-speak)",

    "People & Leadership": [

      "Organizing people or events (you're the planner friend)",

      "Adapting quickly (you roll with changes and figure it out)",
      "Managing multiple projects at once (juggling is your jam)"
    ]
  };

  const [selectedSkills, setSelectedSkills] = useState([]);

  const handleSubjectToggle = (subject) => {
    if (selectedSubjects.includes(subject)) {
      setSelectedSubjects(selectedSubjects.filter(s => s !== subject));
    } else {
      setSelectedSubjects([...selectedSubjects, subject]);
      // If they're adding a second subject, turn off laser-focused
      if (selectedSubjects.length >= 1 && isLaserFocused) {
        setIsLaserFocused(false);
      }
    }
  };

  const handleSkillToggle = (skill) => {
    if (selectedSkills.includes(skill)) {
      setSelectedSkills(selectedSkills.filter(s => s !== skill));
    } else {
      setSelectedSkills([...selectedSkills, skill]);
    }
  };

  const handleMustHaveToggle = (mustHave) => {
    if (selectedMustHaves.includes(mustHave)) {
      setSelectedMustHaves(selectedMustHaves.filter(m => m !== mustHave));
    } else {
      setSelectedMustHaves([...selectedMustHaves, mustHave]);
    }
  };

  const handleDealBreakerToggle = (dealBreaker) => {
    if (selectedDealBreakers.includes(dealBreaker)) {
      setSelectedDealBreakers(selectedDealBreakers.filter(d => d !== dealBreaker));
    } else {
      setSelectedDealBreakers([...selectedDealBreakers, dealBreaker]);
    }
  };

  const getProgress = () => {
    const screenProgress = {
      'intro': 0,
      'section1-interests': 5,
      'section1-ranking': 10,
      'section1-nuance': 15,
      'contact': 20,
      'section2-skills': 30,
      'section2-story': 35,
      'section3-activities': 45,
      'section3-roles': 50,
      'section3-values': 55,
      'section4-musthaves': 65,
      'section4-ranking': 70,
      'section5-dealbreakers': 80,
      'section5-ranking': 85,
      'section6-topscenario': 92,
      'section6-alternate': 96,
      'final-submission': 99,
      'results': 100
    };
    return screenProgress[currentScreen] || 0;
  };

  const tuesdayScenarios = [
    {
      id: 'problem-solver',
      title: 'The Problem-Solver',
      description: "You're at your desk (or workspace) diving deep into a complex challenge—analyzing data, running tests, debugging code, or strategizing solutions. You love the mental puzzle and the satisfaction of cracking it. Might collaborate with a small team, but a lot of focused solo work."
    },
    {
      id: 'creator',
      title: 'The Creator',
      description: "You're making something original—designing, writing, filming, building, composing, developing something new. You have creative control and can see your vision come to life. Some days you collaborate, some days you're in the zone solo. Bringing your own ideas into existence is what drives you."
    },
    {
      id: 'performer',
      title: 'The Performer/Artist',
      description: "You're executing and interpreting—performing music, dancing, acting, or presenting work created by others (or collaboratively). You love the discipline, the refinement of technique, and bringing someone else's vision to life with excellence. The performance itself is where you shine."
    },
    {
      id: 'people-person',
      title: 'The People Person',
      description: "You're meeting with people—clients, patients, students, customers, teammates. Your day is full of conversations, presentations, helping people solve problems or reach goals. The human connection and seeing direct impact on others energizes you."
    },
    {
      id: 'leader',
      title: 'The Leader/Organizer',
      description: "You're managing projects, leading a team, coordinating moving parts. You're the one people come to for decisions, guidance, and direction. You love seeing the big picture come together and empowering others to do great work."
    },
    {
      id: 'researcher',
      title: 'The Researcher/Investigator',
      description: "You're digging deep—reading, researching, experimenting, investigating. Maybe in a lab, library, field site, or archives. You're uncovering new knowledge, testing theories, or finding answers to questions no one's solved yet. Discovery drives you."
    },
    {
      id: 'builder',
      title: 'The Hands-On Builder',
      description: "You're working with your hands—constructing, fixing, crafting, building something physical. Maybe in a workshop, construction site, kitchen, or studio. You love the tactile nature of the work and seeing immediate, tangible results you can touch."
    },
    {
      id: 'educator',
      title: 'The Educator/Mentor',
      description: "You're teaching, training, or mentoring others—in a classroom, workshop, clinic, or one-on-one. You love breaking down complex ideas, seeing the 'lightbulb moment,' and knowing you're shaping someone's growth and future."
    },
    {
      id: 'entrepreneur',
      title: 'The Entrepreneur/Innovator',
      description: "You're building something of your own—a business, a product, a service, a movement. Every day is different: strategy, creative work, problem-solving, pitching ideas. You love the autonomy and the thrill of creating something from nothing."
    },
    {
      id: 'advocate',
      title: 'The Advocate/Change-Maker',
      description: "You're working on policy, social justice, environmental change, or community impact. Maybe through law, nonprofits, government, or activism. You're fighting for what's right and seeing systems change because of your work."
    }
  ];

  const [isLoading, setIsLoading] = useState(false);
  const [loadingMessage, setLoadingMessage] = useState('');

  const mustHaveCategories = {
    "Impact & Meaning": [
      "Making a real-world impact (seeing tangible results from my work)",
      "Helping people directly (face-to-face interaction making people's lives better)",
      "Contributing to something bigger than myself (social good, environmental change, etc.)",
      "Solving important problems (feeling like my work matters)"
    ],
    "Creative & Intellectual Freedom": [
      "Creative freedom (space to imagine, design, create without rigid rules)",
      "Intellectual challenge (constantly learning and growing, not doing repetitive work)",
      "Autonomy (making my own decisions about how to approach my work)",
      "Innovation (working on new ideas, not just maintaining existing systems)"
    ],
    "Financial & Practical Security": [
      "Strong earning potential (I want financial security and comfort)",
      "Job stability (I need to know I can find work and keep it)",
      "Clear career path (I want to see what the next 10-20 years could look like)",
      "Opportunity for advancement (room to grow, get promoted, level up)"
    ],
    "Work Environment & Lifestyle": [
      "Work-life balance (time for family, hobbies, life outside work)",
      "Flexibility (remote options, flexible hours, not chained to a desk 9-5)",
      "Variety (no two days exactly the same, not a rigid routine)",
      "Structure and predictability (I like knowing what to expect)",
      "Fast-paced environment (I thrive on urgency and quick decisions)"
    ],
    "Collaboration & Independence": [
      "Working with a team (collaboration energizes me)",
      "Working independently (I do my best work solo)",
      "Leadership opportunities (I want to guide, manage, or mentor others)",
      "Being part of a community (shared mission, belonging to something)"
    ],
    "Recognition & Growth": [
      "Recognition for my work (awards, promotions, being known in my field)",
      "Continuous learning (formal training, conferences, staying current)",
      "Prestige (respected profession, impressive title)"
    ],
    "Other Must-Haves": [
      "Travel opportunities (domestic or international)",
      "Hands-on work (not just sitting at a computer or desk all day)",
      "Physical activity (moving my body as part of the work)"
    ]
  };

  const dealBreakerCategories = {
    "Work Style & Environment": [
      "Lots of public speaking or presenting (regular presentations stress me out)",
      "Working alone most of the time (isolation drains me)",
      "Working with a team constantly (I need solo time to do my best work)",
      "High-pressure deadlines all the time (constant urgency burns me out)",
      "Slow-paced, repetitive work (I need variety and stimulation)",
      "Sitting at a desk/computer all day (I need to move)",
      "Unpredictable schedule (I need structure and routine)",
      "Rigid 9-5 schedule (I need flexibility)"
    ],
    "Skills & Content": [
      "Heavy math (calculus, statistics, complex equations regularly)",
      "Lots of writing (long papers, reports, constant written communication)",
      "Memorizing tons of information (think medical terminology, laws, formulas)",
      "Working with blood, bodily fluids, or medical situations",
      "Highly technical/mechanical work (engineering, coding, complex systems)",
      "Sales or persuading people to buy/do things",
      "Dealing with conflict or confrontation regularly"
    ],
    "Impact & Meaning": [
      "No direct human interaction (never seeing the people I'm helping)",
      "Abstract work with no tangible results (can't see/touch what I've accomplished)",
      "Purely profit-driven work (no social good or meaning beyond money)",
      "High-stakes decisions where mistakes have serious consequences"
    ],
    "Lifestyle & Practical Concerns": [
      "Low earning potential (financial insecurity stresses me out)",
      "Unstable job market (worried about finding/keeping work)",
      "Long/uncertain path to career (10+ years of school/training)",
      "Limited geographic options (jobs only in certain cities/regions)",
      "Extensive travel (I want to stay rooted in one place)",
      "No travel ever (I need variety and new experiences)"
    ],
    "Other Deal-Breakers": [
      "Extremely competitive environment (constant comparison with peers)",
      "Limited creativity (rigid rules, no room for innovation)",
      "Physical danger or risk",
      "Evening/night/weekend work regularly"
    ]
  };

  const [selectedMustHaves, setSelectedMustHaves] = useState([]);
  const [selectedDealBreakers, setSelectedDealBreakers] = useState([]);
  const [topScenario, setTopScenario] = useState('');
  const [alternateScenario, setAlternateScenario] = useState('');
  const [onlyOneScenario, setOnlyOneScenario] = useState(false);
  const [customScenario, setCustomScenario] = useState('');

  const handleFinalSubmission = () => {
    setIsLoading(true);
    const messages = [
      "Analyzing your academic interests...",
      "Matching your skills and superpowers...",
      "Considering your activities and values...",
      "Filtering based on your must-haves...",
      "Avoiding your deal-breakers...",
      "Envisioning your ideal Tuesday...",
      "Finalizing your personalized recommendations..."
    ];
    
    let messageIndex = 0;
    setLoadingMessage(messages[0]);
    
    const messageInterval = setInterval(() => {
      messageIndex++;
      if (messageIndex < messages.length) {
        setLoadingMessage(messages[messageIndex]);
      } else {
        clearInterval(messageInterval);
        setTimeout(() => {
          setIsLoading(false);
          setCurrentScreen('results');
        }, 500);
      }
    }, 800);
  };

  // MATCHING ALGORITHM - The Brain!
  const generateMatches = () => {
    const majorFamilies = {
      'creative-arts': {
        title: '🎨 Creative Arts & Media',
        majors: ['Film & Media Studies', 'Graphic Design', 'Fine Arts', 'Photography', 'Creative Writing', 'Communications', 'Journalism', 'Playwriting', 'Technical Theatre & Music Production', 'Fashion Design'],
        score: 0,
        reasons: []
      },
      'stem': {
        title: '🧠 STEM & Research',
        majors: ['Biology', 'Chemistry', 'Physics', 'Mathematics', 'Computer Science', 'Data Science', 'Environmental Science', 'Neuroscience'],
        score: 0,
        reasons: []
      },
      'engineering': {
        title: '🏗️ Engineering & Applied Tech',
        majors: ['Mechanical Engineering', 'Civil Engineering', 'Electrical Engineering', 'Biomedical Engineering', 'Computer Engineering', 'Industrial Design', 'Architecture'],
        score: 0,
        reasons: []
      },
      'business': {
        title: '💼 Business & Entrepreneurship',
        majors: ['Business Administration', 'Marketing', 'Finance', 'Economics', 'Management', 'Entrepreneurship', 'Supply Chain Management', 'Accounting'],
        score: 0,
        reasons: []
      },
      'health': {
        title: '🤝 Health & Human Services',
        majors: ['Nursing', 'Public Health', 'Physical Therapy', 'Occupational Therapy', 'Kinesiology', 'Health Administration', 'Nutrition', 'Social Work'],
        score: 0,
        reasons: []
      },
      'education': {
        title: '🧑‍🏫 Education & Mentorship',
        majors: ['Education (Elementary/Secondary)', 'Special Education', 'Educational Psychology', 'Counseling', 'Speech Pathology', 'Curriculum Development'],
        score: 0,
        reasons: []
      },
      'performing-arts': {
        title: '🎭 Performing Arts',
        majors: ['Dance', 'Music Performance', 'Music Education', 'Music Composition', 'Acting', 'Musical Theatre', 'Improv'],
        score: 0,
        reasons: []
      },
      'law-policy': {
        title: '⚖️ Law, Policy & Social Justice',
        majors: ['Political Science', 'Pre-Law', 'Public Policy', 'International Relations', 'Sociology', 'Criminal Justice', 'Social Justice Studies'],
        score: 0,
        reasons: []
      },
      'humanities': {
        title: '📚 Humanities & Social Sciences',
        majors: ['Psychology', 'History', 'Philosophy', 'English Literature', 'Anthropology', 'Linguistics', 'Gender Studies', 'Religious Studies', 'Sociology'],
        score: 0,
        reasons: []
      }
    };

    // Get top academic subject
    const topSubject = answers.topChoice || selectedSubjects[0] || '';
    
    // Score based on Tuesday Scenario (Top Choice) - 40 points
    const scenarioMapping = {
      'problem-solver': ['stem', 'engineering'],
      'creator': ['creative-arts', 'engineering'],
      'performer': ['performing-arts'],
      'people-person': ['health', 'education', 'business'],
      'leader': ['business', 'education', 'law-policy'],
      'researcher': ['stem', 'humanities', 'law-policy'],
      'builder': ['engineering', 'creative-arts'],
      'educator': ['education', 'humanities'],
      'entrepreneur': ['business', 'creative-arts'],
      'advocate': ['law-policy', 'humanities']
    };

    if (topScenario && topScenario !== 'custom') {
      const matchedFamilies = scenarioMapping[topScenario] || [];
      matchedFamilies.forEach(family => {
        majorFamilies[family].score += 40;
        majorFamilies[family].reasons.push(`You chose the ${tuesdayScenarios.find(s => s.id === topScenario)?.title} scenario`);
      });
    }

    // Score based on Top Academic Subject - 25 points
    const subjectMapping = {
      'English': ['creative-arts', 'humanities', 'law-policy'],
      'Math': ['stem', 'engineering', 'business'],
      'Life Sciences': ['stem', 'health'],
      'Physical Sciences': ['stem', 'engineering'],
      'History': ['humanities', 'law-policy', 'education'],
      'Social Sciences': ['humanities', 'law-policy', 'business'],
      'Foreign Languages': ['humanities', 'education'],
      'Computer Science': ['stem', 'engineering'],
      'Visual Arts': ['creative-arts'],
      'Performing Arts': ['performing-arts', 'creative-arts'],
      'Business': ['business'],
      'Engineering': ['engineering'],
      'Hands-On Building': ['engineering', 'creative-arts'],
      'Health Sciences': ['health']
    };

    Object.keys(subjectMapping).forEach(subject => {
      if (topSubject.includes(subject)) {
        const matchedFamilies = subjectMapping[subject] || [];
        matchedFamilies.forEach(family => {
          majorFamilies[family].score += 25;
          majorFamilies[family].reasons.push(`You're drawn to ${subject}`);
        });
      }
    });

    // Score based on Must-Haves (Top 3) - 40/25/15 points
    const mustHaveMapping = {
      'Creative freedom': ['creative-arts', 'performing-arts', 'business'],
      'Intellectual challenge': ['stem', 'humanities', 'law-policy'],
      'Helping people directly': ['health', 'education'],
      'Making a real-world impact': ['health', 'law-policy', 'engineering'],
      'Strong earning potential': ['business', 'engineering', 'stem'],
      'Innovation': ['engineering', 'business', 'stem'],
      'Leadership opportunities': ['business', 'education', 'law-policy'],
      'Autonomy': ['business', 'creative-arts'],
      'Hands-on work': ['engineering', 'health', 'performing-arts']
    };

    [answers.mustHave1, answers.mustHave2, answers.mustHave3].forEach((mustHave, index) => {
      const points = [40, 25, 15][index];
      if (mustHave) {
        Object.keys(mustHaveMapping).forEach(keyword => {
          if (mustHave.includes(keyword)) {
            const matchedFamilies = mustHaveMapping[keyword] || [];
            matchedFamilies.forEach(family => {
              majorFamilies[family].score += points;
              if (index === 0) {
                majorFamilies[family].reasons.push(`You value ${keyword.toLowerCase()}`);
              }
            });
          }
        });
      }
    });

    // Apply deal-breaker penalties - reduce score by 30 points
    const dealBreakerPenalties = {
      'Heavy math': ['stem', 'engineering', 'business'],
      'Lots of writing': ['humanities', 'law-policy', 'creative-arts'],
      'Working alone': ['stem', 'humanities', 'creative-arts'],
      'Working with a team': ['business', 'education', 'health'],
      'Public speaking': ['education', 'law-policy', 'business'],
      'Limited creativity': ['creative-arts', 'performing-arts'],
      'Low earning potential': ['education', 'humanities', 'performing-arts'],
      'blood': ['health']
    };

    [answers.dealBreaker1, answers.dealBreaker2, answers.dealBreaker3].forEach(dealBreaker => {
      if (dealBreaker) {
        Object.keys(dealBreakerPenalties).forEach(keyword => {
          if (dealBreaker.toLowerCase().includes(keyword.toLowerCase())) {
            const penalizedFamilies = dealBreakerPenalties[keyword] || [];
            penalizedFamilies.forEach(family => {
              majorFamilies[family].score -= 30;
            });
          }
        });
      }
    });

    // Score based on Skills - 15 points
    const creativeSkills = selectedSkills.filter(s => s.includes('Creating visual') || s.includes('Designing') || s.includes('Writing creatively') || s.includes('Telling stories') || s.includes('Performing')).length;
    const analyticalSkills = selectedSkills.filter(s => s.includes('Analyzing data') || s.includes('Solving logic') || s.includes('Strategic thinking') || s.includes('Research')).length;
    const peopleSkills = selectedSkills.filter(s => s.includes('Leading') || s.includes('Organizing') || s.includes('Helping people') || s.includes('Teaching') || s.includes('Collaborating')).length;
    const technicalSkills = selectedSkills.filter(s => s.includes('Building') || s.includes('Coding') || s.includes('mechanical')).length;

    if (creativeSkills >= 2) {
      majorFamilies['creative-arts'].score += 15;
      majorFamilies['performing-arts'].score += 15;
    }
    if (analyticalSkills >= 2) {
      majorFamilies['stem'].score += 15;
      majorFamilies['humanities'].score += 10;
    }
    if (peopleSkills >= 2) {
      majorFamilies['health'].score += 15;
      majorFamilies['education'].score += 15;
      majorFamilies['business'].score += 10;
    }
    if (technicalSkills >= 2) {
      majorFamilies['engineering'].score += 15;
    }

    // Sort families by score
    const sortedFamilies = Object.entries(majorFamilies)
      .sort((a, b) => b[1].score - a[1].score)
      .map(([id, data]) => ({ id, ...data }));

    return sortedFamilies;
  };

  // Detect patterns and paradoxes
  const detectPatterns = () => {
    const patterns = [];

    // Parent-Pleaser Pattern
    const stemSubjects = ['Math', 'Life Sciences', 'Physical Sciences', 'Computer Science'];
    const topSubjectIsStem = stemSubjects.some(s => (answers.topChoice || '').includes(s));
    const mustHavesIncludeMoney = (answers.mustHave1 || '').includes('earning') || (answers.mustHave2 || '').includes('earning');
    const creativeSkills = selectedSkills.filter(s => s.includes('Creating') || s.includes('Designing') || s.includes('Writing') || s.includes('Telling') || s.includes('Performing')).length;

    if (topSubjectIsStem && mustHavesIncludeMoney && creativeSkills >= 3) {
      patterns.push({
        type: 'parent-pleaser',
        title: '💭 WE NOTICED SOMETHING INTERESTING',
        message: "Your academic strengths lean toward STEM, and financial security is a top priority for you. However, your natural skills are primarily in creative fields.\n\nThis isn't necessarily a contradiction—but it's worth reflecting on:\n• Are you exploring what genuinely excites YOU?\n• Could external pressures be influencing your academic choices?\n• Have you considered fields that blend both, like UX Design, Architectural Engineering, or Science Communication?\n\nCollege is YOUR time to discover what truly energizes you, not just what feels \"safe\" or makes others happy."
      });
    }

    // Public Speaking Paradox
    const dealBreakersIncludeSpeaking = (answers.dealBreaker1 || '').includes('speaking') || (answers.dealBreaker2 || '').includes('speaking') || (answers.dealBreaker3 || '').includes('speaking');
    const scenarioNeedsSpeaking = topScenario === 'educator' || topScenario === 'leader' || topScenario === 'advocate';

    if (dealBreakersIncludeSpeaking && scenarioNeedsSpeaking) {
      patterns.push({
        type: 'speaking-paradox',
        title: '💭 WE NOTICED A POTENTIAL CONTRADICTION',

      'creative-arts': ['Visual Arts', 'English', 'Performing Arts'],
      'business': ['Business', 'Math', 'Social Sciences'],
      'health': ['Life Sciences', 'Health Sciences', 'Social Sciences'],
      'education': ['English', 'Social Sciences', 'Foreign Languages'],
      'performing-arts': ['Performing Arts', 'Visual Arts'],
      'law-policy': ['History', 'Social Sciences', 'English'],
      'humanities': ['English', 'History', 'Social Sciences', 'Foreign Languages']

              {/* Major Family Matches */}
              <div style={{ marginBottom: '32px' }}>
                <h2 style={{
                  fontSize: '24px',
                  color: '#311ec8',
                  marginBottom: '20px',
                  fontWeight: '600',
                  fontFamily: "'Inter', sans-serif"
                }}>
                  {explorer ? 'YOUR DIRECTIONS TO EXPLORE' : 'YOUR TOP MAJOR FAMILIES'}
                </h2>

                {topMatches.filter(m => m.score > 0).map((match, idx) => (
                  <details key={idx} style={{
                    marginBottom: '16px',
                    border: '2px solid rgba(49,30,200,0.2)',
                    borderRadius: '10px',
                    overflow: 'hidden'
                  }}>
                    <summary style={{
                      padding: '20px',
                      background: 'rgba(49,30,200,0.05)',
                      cursor: 'pointer',
                      fontSize: '20px',
                      fontWeight: '600',
                      color: '#311ec8',
                      fontFamily: "'Crimson Text', serif",
                      listStyle: 'none',
                      display: 'flex',
                      justifyContent: 'space-between',
                      alignItems: 'center'
                    }}>
                      <span>{match.title}</span>
                      <span style={{ fontSize: '16px' }}>▼</span>
                    </summary>
                    <div style={{ padding: '24px', background: 'white' }}>
                      {/* Why This Fits */}
                      <div style={{ marginBottom: '20px' }}>
                        <h4 style={{
                          fontSize: '16px',
                          color: '#311ec8',
                          marginBottom: '8px',
                          fontWeight: '600',
                          fontFamily: "'Inter', sans-serif",
                          textTransform: 'uppercase',
                          letterSpacing: '0.5px'
                        }}>
                          Why This Fits You:
                        </h4>
                        <p style={{
                          fontSize: '15px',
                          color: '#495057',
                          lineHeight: '1.7',
                          fontFamily: "'Inter', sans-serif",
                          margin: 0
                        }}>
                          {generateWhyThisFits(match, explorer)}
                        </p>
                      </div>

                      {/* Majors to Explore */}
                      <div style={{ marginBottom: '20px' }}>
                        <h4 style={{
                          fontSize: '16px',
                          color: '#311ec8',
                          marginBottom: '12px',
                          fontWeight: '600',
                          fontFamily: "'Inter', sans-serif",
                          textTransform: 'uppercase',
                          letterSpacing: '0.5px'
                        }}>
                          Majors to Explore:
                        </h4>
                        <ul style={{
                          margin: 0,
                          paddingLeft: '20px',
                          display: 'grid',
                          gap: '6px'
                        }}>
                          {match.majors.map((major, i) => (
                            <li key={i} style={{
                              fontSize: '15px',
                              color: '#495057',
                              fontFamily: "'Inter', sans-serif",
                              lineHeight: '1.6'
                            }}>
                              {major}
                            </li>
                          ))}
                        </ul>
                      </div>

                      {/* Next Steps */}
                      <div>
                        <h4 style={{
                          fontSize: '16px',
                          color: '#311ec8',
                          marginBottom: '12px',
                          fontWeight: '600',
                          fontFamily: "'Inter', sans-serif",
                          textTransform: 'uppercase',
                          letterSpacing: '0.5px'
                        }}>
                          Next Steps:
                        </h4>
                        <ul style={{
                          margin: 0,
                          paddingLeft: '20px',
                          display: 'grid',
                          gap: '6px'
                        }}>
                          {[
                            'Research programs at colleges on your list',
                            'Connect with current students in these majors',
                            'Look for internships or summer programs',
                            'Consider relevant extracurriculars to explore',
                            'Talk this through with Heather at your next meeting'
                          ].map((step, i) => (
                            <li key={i} style={{
                              fontSize: '14px',
                              color: '#6c757d',
                              fontFamily: "'Inter', sans-serif",
                              lineHeight: '1.6'
                            }}>
                              → {step}
                            </li>
                          ))}
                        </ul>
                      </div>
                    </div>
                  </details>
                ))}
              </div>

              {/* Reality Checks */}
              {(needsMedicalWarning || needsStemWarning || needsLawWarning) && (
                <div style={{ marginBottom: '32px' }}>
                  {needsMedicalWarning && (
                    <div style={{
                      padding: '20px',
                      background: '#e7f3ff',
                      border: '2px solid #1976d2',
                      borderRadius: '10px',
                      marginBottom: '16px'
                    }}>
                      <h4 style={{
                        fontSize: '16px',
                        color: '#0d47a1',
                        marginBottom: '12px',
                        fontWeight: '600',
                        fontFamily: "'Inter', sans-serif"
                      }}>
                        ⏳ IMPORTANT REALITY CHECK: Medical Careers
                      </h4>
                      <p style={{
                        fontSize: '14px',
                        color: '#0d47a1',
                        lineHeight: '1.7',
                        fontFamily: "'Inter', sans-serif",
                        margin: 0
                      }}>
                        Medical careers require extensive education: 4 years undergraduate + 4 years medical school + 3-7 years residency. You could be 30+ before earning a full physician salary. This is a long path that requires dedication and financial planning.
                      </p>
                    </div>
                  )}

                  {needsStemWarning && (
                    <div style={{
                      padding: '20px',
                      background: '#e7f3ff',
                      border: '2px solid #1976d2',
                      borderRadius: '10px',
                      marginBottom: '16px'
                    }}>
                      <h4 style={{
                        fontSize: '16px',
                        color: '#0d47a1',
                        marginBottom: '12px',
                        fontWeight: '600',
                        fontFamily: "'Inter', sans-serif"
                      }}>
                        ⏳ IMPORTANT REALITY CHECK: STEM Research Careers
                      </h4>
                      <p style={{
                        fontSize: '14px',
                        color: '#0d47a1',
                        lineHeight: '1.7',
                        fontFamily: "'Inter', sans-serif",
                        margin: 0
                      }}>
                        Research careers often require graduate education: Many positions need a Master's (2 years) or PhD (5-7 years). PhD students earn stipends but less during training. Make sure you're passionate about the research itself, not just the prestige.
                      </p>
                    </div>
                  )}

                  {needsLawWarning && (
                    <div style={{
                      padding: '20px',
                      background: '#e7f3ff',
                      border: '2px solid #1976d2',
                      borderRadius: '10px',
                      marginBottom: '16px'
                    }}>
                      <h4 style={{
                        fontSize: '16px',
                        color: '#0d47a1',
                        marginBottom: '12px',
                        fontWeight: '600',
                        fontFamily: "'Inter', sans-serif"
                      }}>
                        ⏳ IMPORTANT REALITY CHECK: Law Careers
                      </h4>
                      <p style={{
                        fontSize: '14px',
                        color: '#0d47a1',
                        lineHeight: '1.7',
                        fontFamily: "'Inter', sans-serif",
                        margin: 0
                      }}>
                        Legal careers require 3 years of law school after undergraduate, often resulting in significant debt ($100K+). The job market is competitive, especially for high-paying positions. Make sure you've considered the financial investment.
                      </p>
                    </div>
                  )}
                </div>
              )}

              {/* Explorer Specific Guidance */}
              {explorer && (
                <div style={{
                  padding: '24px',
                  background: '#f8f9fa',
                  borderRadius: '10px',
                  marginBottom: '32px'
                }}>
                  <h3 style={{
                    fontSize: '20px',
                    color: '#311ec8',
                    marginBottom: '16px',
                    fontWeight: '600',
                    fontFamily: "'Inter', sans-serif"
                  }}>
                    📚 Next Steps for Explorers
                  </h3>
                  <ul style={{
                    margin: 0,
                    paddingLeft: '20px',
                    display: 'grid',
                    gap: '10px'
                  }}>
                    {[
                      'Take intro courses in different fields freshman year',
                      'Talk to students in various majors about their daily reality',
                      'Try internships, job shadowing, or volunteering',
                      'Consider colleges with strong liberal arts programs and late declaration deadlines',
                      'Remember: 30-50% of students change majors—exploration is normal!'
                    ].map((step, i) => (
                      <li key={i} style={{
                        fontSize: '15px',
                        color: '#495057',
                        fontFamily: "'Inter', sans-serif",
                        lineHeight: '1.7'
                      }}>
                        {step}
                      </li>
                    ))}
                  </ul>
                  <div style={{
                    marginTop: '20px',
                    padding: '16px',
                    background: 'white',
                    borderRadius: '8px',
                    border: '1px solid #dee2e6'
                  }}>
                    <p style={{
                      fontSize: '15px',
                      color: '#311ec8',
                      fontWeight: '600',
                      marginBottom: '8px',
                      fontFamily: "'Inter', sans-serif"
                    }}>
                      💡 Reflection: What do you hope college will give you?
                    </p>
                    <p style={{
                      fontSize: '14px',
                      color: '#6c757d',
                      lineHeight: '1.6',
                      fontFamily: "'Inter', sans-serif",
                      margin: 0
                    }}>
                      Career preparation? Broad education? Time to explore? Skills for entrepreneurship? Personal growth? Your answer can help guide which colleges and programs to consider.
                    </p>
                  </div>
                </div>
              )}

              {/* Action Buttons */}
              <div style={{
                display: 'flex',
                gap: '16px',
                justifyContent: 'center',
                flexWrap: 'wrap'
              }}>
                <button
                  onClick={() => {
                    // Reset to allow editing
                    setCurrentScreen('intro');
                  }}
                  style={{
                    background: 'white',
                    color: '#311ec8',
                    border: '2px solid #311ec8',
                    padding: '14px 32px',
                    fontSize: '16px',
                    borderRadius: '50px',
                    cursor: 'pointer',
                    fontWeight: '600',
                    fontFamily: "'Inter', sans-serif",
                    transition: 'all 0.2s ease'
                  }}
                  onMouseEnter={(e) => {
                    e.target.style.background = 'rgba(49,30,200,0.05)';
                  }}
                  onMouseLeave={(e) => {
                    e.target.style.background = 'white';
                  }}
                >
                  Review & Edit My Answers
                </button>
                <button
                  onClick={() => {
                    // Reset everything for new assessment
                    window.location.reload();
                  }}
                  style={{
                    background: 'linear-gradient(135deg, #311ec8 0%, #5a3ed9 100%)',
                    color: 'white',
                    border: 'none',
                    padding: '14px 32px',
                    fontSize: '16px',
                    borderRadius: '50px',
                    cursor: 'pointer',
                    fontWeight: '600',
                    fontFamily: "'Inter', sans-serif",
                    boxShadow: '0 4px 16px rgba(49,30,200,0.3)'
                  }}
                >
                  Start New Assessment
                </button>
              </div>
            </div>
          );
        })()}

      </div>
    </div>
  );
};


    // Render the component
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<MajorExplorer />);
  </script>
</body>
</html>
